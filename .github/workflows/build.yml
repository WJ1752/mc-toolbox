name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows 单文件构建
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 缓存 WebView2 SDK
        uses: actions/cache@v4
        with:
          path: host/lib
          key: webview2-sdk-${{ runner.os }}-v1

      - name: 缓存 npx 工具（esbuild / postject）
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/npm-cache/_npx
          key: npx-${{ runner.os }}-${{ hashFiles('build.mjs') }}

      - name: 环境信息
        shell: pwsh
        run: |
          node -v
          npm -v
          if (Test-Path 'C:/Windows/Microsoft.NET/Framework64/v4.0.30319/csc.exe') { 'csc: OK' } else { 'csc: MISSING' }
          if (Test-Path 'C:/Program Files/Git/bin/bash.exe') { 'bash: OK' } else { 'bash: MISSING' }

      - name: 单元测试
        shell: bash
        run: node --test tests/*.test.mjs

      - name: 构建单文件 exe
        run: node build.mjs

      - name: 校验产物
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/mc-toolbox.exe')) { throw '构建产物 dist/mc-toolbox.exe 不存在' }
          Get-Item 'dist/mc-toolbox.exe' | Select-Object Name, Length, LastWriteTime

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: mc-toolbox-exe
          path: dist/mc-toolbox.exe
          if-no-files-found: error
          retention-days: 14

      - name: 发布 GitHub Release（仅 v* 标签）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag 'dist/mc-toolbox.exe' --clobber
          } else {
            gh release create $tag 'dist/mc-toolbox.exe' --title $tag --generate-notes
          }
