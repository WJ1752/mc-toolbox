# ============================================================================
# MC整合包自动翻译工具（mc-i18n）默认配置模板
# ============================================================================
# 使用方法：
#   1. 复制本文件为 config.yaml（放到当前工作目录或整合包根目录均可，
#      translate 运行时会自动查找；也可用 -c 参数显式指定）；
#   2. 填写引擎密钥，把 engine.primary 改成对应引擎名；
#   3. 不改任何配置直接运行 → 使用 demo 演示引擎（零密钥开箱即用）。
#
# 密钥优先级：环境变量 > config.yaml
#   BAIDU_APP_ID / BAIDU_APP_KEY → baidu.app_id / baidu.app_key
#   DEEPL_API_KEY                → deepl.api_key
#   OPENAI_API_KEY               → openai.api_key
#   YOUDAO_APP_ID / YOUDAO_APP_KEY → youdao.app_id / youdao.app_key
# ============================================================================

# ----------------------------------------------------------------------------
# 引擎选择：主引擎 + 降级链
#   主引擎批量翻译失败（限流/超时/网络）时，按 fallback 顺序逐个接管该批次。
#   可选值：google（谷歌免费·推荐） / youdao（有道） / baidu（百度） /
#           deepl（DeepL） / openai（OpenAI 兼容·AI 补翻） / demo（演示）
# ----------------------------------------------------------------------------
engine:
  primary: demo          # 默认 demo 引擎：无密钥即可跑通全流程，正式使用请切换
  fallback: []           # 示例：[baidu, demo] —— baidu 失败时降级到 demo

# ----------------------------------------------------------------------------
# 谷歌翻译（免费 gtx 接口 · 零密钥 · 推荐首选）
#   国内网络不可直连时，把 endpoint 换成可用的镜像地址即可，其余逻辑不变。
# ----------------------------------------------------------------------------
google:
  endpoint: "https://translate.googleapis.com/translate_a/single"
  qps: 5.0                # 免费接口保守限流
  batch_char_budget: 800  # 单请求字符预算（多条原文 \n 拼接）
  timeout: 15.0

# ----------------------------------------------------------------------------
# 有道智云（https://ai.youdao.com/ · 官方 API，新用户有免费额度）
#   控制台创建"文本翻译"应用后获取 应用ID 与 应用密钥。
#   签名算法 v3：sha256(appKey + input + salt + curtime + appSecret)。
# ----------------------------------------------------------------------------
youdao:
  app_id: ""              # 应用 ID（或环境变量 YOUDAO_APP_ID）
  app_key: ""             # 应用密钥（或环境变量 YOUDAO_APP_KEY）
  endpoint: "https://openapi.youdao.com/api"
  qps: 1.0
  batch_char_budget: 1000
  timeout: 15.0

# ----------------------------------------------------------------------------
# 百度翻译开放平台（https://fanyi-api.baidu.com/）
#   注册后在"开发者信息"页获取 app_id 与密钥。
#   配额参考（2026-09 官方文档）：
#     标准版            5 万字符/月，QPS=1，单请求 ≤1000 字符（下方默认值）
#     个人认证高级版    100 万字符/月，QPS=10，单请求 ≤6000 字符
#   使用高级版时请同步调整：qps: 10.0，batch_char_budget: 6000
# ----------------------------------------------------------------------------
baidu:
  app_id: ""             # AppID（或环境变量 BAIDU_APP_ID）
  app_key: ""            # 密钥（或环境变量 BAIDU_APP_KEY）
  endpoint: "https://fanyi-api.baidu.com/api/trans/vip/translate"
  qps: 1.0               # 每秒最大请求数（工具内置最小间隔限流）
  batch_char_budget: 1000  # 单请求字符预算：多条原文用 \n 拼接后不超过该值
  timeout: 15.0          # HTTP 超时（秒）

# ----------------------------------------------------------------------------
# DeepL API（https://www.deepl.com/pro-api）
#   Free 套餐 50 万字符/月；Free 密钥以 ":fx" 结尾，工具会自动切换到
#   api-free.deepl.com 域名；Pro 密钥无需任何额外配置。
# ----------------------------------------------------------------------------
deepl:
  api_key: ""            # API Key（或环境变量 DEEPL_API_KEY）
  endpoint: null         # null = 按密钥后缀自动选择域名；也可手动指定完整端点
  batch_char_budget: 40000  # 单请求字符预算（DeepL 硬上限 128KiB，此处保守设定）
  timeout: 30.0

# ----------------------------------------------------------------------------
# OpenAI 兼容接口（LLM 扩展位：OpenAI / DeepSeek / Kimi / GLM / 本地 vLLM）
#   只要服务实现了 /chat/completions 协议即可。批量按"编号 JSON"协议翻译，
#   系统提示词硬性要求保留 ⟦N⟧ 占位符标记；整批失败自动降级为逐条请求。
#   切换厂商示例：base_url: "https://api.deepseek.com/v1"，model: "deepseek-chat"
# ----------------------------------------------------------------------------
openai:
  api_key: ""            # API Key（或环境变量 OPENAI_API_KEY）
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o-mini"
  temperature: 0.2       # 翻译任务建议低温：稳定、少发挥
  batch_size: 20         # 一次请求携带的文本条数
  timeout: 90.0
  system_prompt: "你是 Minecraft 模组语言文件的机器翻译引擎，把英文文本翻译为简体中文。硬性规则：1) 文本中的 ⟦数字⟧ 标记是格式占位符（%s、%d、颜色代码、变量等），必须在译文的合适位置原样保留，数量不得增减、内容不得改写；2) 译文必须符合 Minecraft 简体中文社区的行文习惯；3) 只输出 JSON 对象，键为原文编号、值为译文，不要任何解释或代码围栏。"

# ----------------------------------------------------------------------------
# 重试策略（对限流/网络错误/5xx 生效；鉴权与配额错误不重试直接降级）
# ----------------------------------------------------------------------------
retry:
  max_retries: 3         # 单请求最大重试次数
  initial_delay: 1.0     # 首次重试延迟（秒）
  backoff_factor: 2.0    # 指数退避倍率：1s → 2s → 4s → ...
  max_delay: 30.0        # 单次延迟上限（秒）
  jitter: 0.3            # 随机抖动比例（0~1），避免整点重试风暴

# ----------------------------------------------------------------------------
# 占位符保护引擎开关（core/placeholders.py）
#   默认覆盖：Java String.format（%s/%d/%1$s/%%）、§ 颜色码、${变量}、
#   {0}/{name}、%player% 变量、\n 等转义序列——这些高频项无需改动。
#   以下开关用于扩展或收窄识别范围：
# ----------------------------------------------------------------------------
protect:
  amp_color_codes: false   # & 颜色码（&a/&c…）：普通文本含 & 时会误伤，按需开启
  percent_variables: true  # %player% 成对百分比变量
  xml_tags: false          # <b></b> 等 XML 标签（任务书/教程类内容开启）
  brace_placeholders: true # {0} / {name} 花括号占位符
  dollar_braces: true      # ${player} 变量
  escape_sequences: true   # \n \t \" \\ \u00a7 转义序列
  out_of_order: auto       # 占位符乱序容忍：auto=原文含 %n$ 时容忍 | always | never
  # 标记丢失兜底（v0.3.5）：
  #   strict  = 引擎吞掉 ⟦N⟧ 且无法建立映射时抛错，
  #             走 重试 → 备用引擎 → 保留英文 降级链（默认）
  #   salvage = 尽力回填（缺失占位符按原文次序补到句末标点前），
  #             保证占位符零丢失、绝不退回英文；语序可能生硬，
  #             相关条目会进入人工复核清单。适合"汉化率优先"的整合包。
  missing_token_policy: strict

# ----------------------------------------------------------------------------
# 翻译缓存（SQLite；断点续翻即"重启后命中缓存继续翻"）
# ----------------------------------------------------------------------------
cache:
  enabled: true
  path: null               # null = 默认 <整合包>/.mc-i18n/cache.sqlite3
  ttl_days: 0              # 缓存有效期（天）；0 = 永久

# ----------------------------------------------------------------------------
# 日志级别：控制台打印级别 + 文件记录级别（文件固定写入 .mc-i18n/logs/）
# ----------------------------------------------------------------------------
log:
  console_level: "INFO"
  file_level: "DEBUG"

# ----------------------------------------------------------------------------
# 通用设置
# ----------------------------------------------------------------------------
workers: 4                # 翻译并发线程数（对 QPS=1 的百度建议 1~2）
source_lang: "en_us"      # 默认源语言（可被 CLI --lang 覆盖）
target_lang: "zh_cn"      # 默认目标语言（可被 CLI --target 覆盖）
